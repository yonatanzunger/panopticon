[project]
name = "panopticon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yonatan Zunger", email = "zunger@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "timezonefinder>=9.0.0",
]

[project.scripts]
panopticon = "panopticon:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
